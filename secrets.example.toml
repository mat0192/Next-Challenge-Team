# Copier dans les secrets Streamlit, jamais dans un fichier commité contenant des secrets.
[storage]
backend = "github"
repository = "mat0192/Next-Challenge-Team"
branch = "team-data"
token = "REMPLACER_DANS_LES_SECRETS_STREAMLIT"

# Chaque personne a son identifiant et une phrase de passe différente.
# Générer le hash avec : python manage.py hash-password
[users.mathis]
name = "Mathis"
role = "editor"
password_hash = "REMPLACER_PAR_LE_HASH_GENERE"

# Pour ajouter votre amie : dupliquer ce bloc avec son identifiant.
# role = "editor" : portefeuille, décisions, rôles, restauration et toutes les fiches.
# role = "analyst" : création et modification de ses propres fiches, consultation du reste.
# Les rôles de l’application ne modifient pas les permissions GitHub ni NextWise.
